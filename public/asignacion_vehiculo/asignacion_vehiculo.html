<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Asignación</title>
    <link rel="stylesheet" href="/index.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ORICHUNA.CA</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/">Inicio</a>
                <a href="/asignacion"  class="active">Asignar nuevo ticket</a>
                <a href="/surtir-estacion">Surtir estacion</a>
                <a href="/gestion-usuarios">Gestión de Usuarios</a>
                <a href="/login" id="logout">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="recovery-card">
                <div class="recovery-header">
                    <h1>Asignación de ticket</h1>
                    <p style="color: var(--primary-color); font-weight: bold; font-size: 1.1rem; margin-top: 0.5rem;">
                        Tiempo restante: <span id="tiempo">03:00</span>
                    </p>
                </div>
                <form id="form-asignacion" class="recovery-form">
                    <label>Tipo de Vehículo:</label>
                    <select id="tipoVehiculo" required>
                        <option value="moto">Moto</option>
                        <option value="automovil">Automóvil</option>
                        <option value="camion">Camión</option>
                    </select>

                    <label>Marca:</label>
                    <input type="text" id="marca" pattern="[A-Za-z]+" title="Solo letras" required>

                    <label>Modelo:</label>
                    <input type="text" id="modelo" required>

                    <label>Placa:</label>
                    <input type="text" id="placa" required>

                    <label>Color:</label>
                    <input type="text" id="color" pattern="[A-Za-z]+" title="Solo letras" required>

                    <label>Cantidad de combustible (Lts):</label>
                    <input type="number" id="cantidadCombustible" min="0" step="0.1" required>

                    <button type="submit" id="btn-procesar" class="primary-btn">Procesar Asignación</button>
                </form>
            </div>

            <!-- ticket -->
            <div class="recovery-card" id="ticket-container" style="display: none;">
                <div class="recovery-header" style="text-align: center; margin-bottom: 0;">
                    <span class="brand" style="font-size: 1rem;">estación de servicios "ORICHUNA.CA"</span>
                    <p style="margin-top: 0.5rem;"><strong>Fecha:</strong> <span id="t-fecha"></span></p>

                    <h1 id="t-turno" style="font-size: 3.5em; margin: 1.5rem 0; color: var(--primary-color);"></h1>

                    <div style="text-align: left; background: white; padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--border-input-color);">
                        <p><strong>Vehículo:</strong> <span id="t-vehiculo"></span></p>
                        <p style="margin: 0.5rem 0;"><strong>Estatus:</strong> <span id="t-estatus"></span></p>
                        <p><strong>Código Verificación:</strong> <span id="t-codigo" style="color: var(--primary-color); font-weight: bold; font-size: 1.2rem;"></span></p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/asignacion_vehiculo/asignacion.js"></script>
</body>
</html>
