<!DOCTYPE html>
<html lang="es">
    <head>
        <title>INICIO SESION</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <div class="container">
            <div class="form-container">
                <div class="form-top">
                    <span>ORICHUNA.CA</span>
                </div>
                <form class="form" id="form" autocomplete="off">
                    <div class="login">
                        <h2>Bienvenido</h2>
                        <p>Inicie sesión para continuar.</p>
                        <div class="input">
                            <label for="email">Correo electrónico</label>
                            <div class="identifier-field">
                                <input type="email" name="email" id="email" placeholder="Correo electrónico" autocomplete="email" required>
                            </div>
                        </div>
                        <div class="input">
                            <label for="password">Contraseña</label>
                            <div class="password-field">
                                <input type="password" name="password" id="password" placeholder="Contraseña" autocomplete="new-password" required>
                                <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar contraseña">Mostrar</button>
                            </div>
                        </div>
                    </div>
                    <div class="buttons">
                        <button>Iniciar sesión</button>
                    </div>
                </form>
                <div class="form-bot">
                    <span>ºGEY EL QUE LO LEA</span>
                </div>
            </div>
            <div class="banner toggle" id="banner">
                <div class="circulo"></div>
                <div class="circulo-2"></div>
            </div>
        </div>

        <script src="login.js" defer></script>
    </body>
</html>
