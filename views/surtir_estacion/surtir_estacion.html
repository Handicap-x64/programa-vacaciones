<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo Surtir</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="recovery-body">
    <div class="recovery-card">
        <div class="recovery-header">
            <span class="brand">ADMINISTRADOR</span>
            <h1>Módulo Surtir</h1>
            <p>Registro de combustible del día.</p>
        </div>
        <form id="form-surtir" class="recovery-form">
            <label>Combustible total (Lts):</label>
            <input type="number" id="totalCombustible" required>
            
            <label>Hora Inicio:</label>
            <input type="time" id="horaInicio" required>
            
            <label>Hora Cierre:</label>
            <input type="time" id="horaCierre" required>
            
            <label>Asignación Moto (Lts):</label>
            <input type="number" id="asigMoto" required>
            
            <label>Asignación Automóvil (Lts):</label>
            <input type="number" id="asigAuto" required>
            
            <label>Asignación Camión (Lts):</label>
            <input type="number" id="asigCamion" required>
            
            <button type="submit" class="primary-btn">Guardar Surtido</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
